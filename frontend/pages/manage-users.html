<section id="admin-manage-users" class="admin-manage-users">
  <div class="container-fluid">
    <div class="mb-5">
      <h2>Manage Users &amp; Subscriptions</h2>

      <div class="btn-group mb-3" role="group">
        <button class="btn btn-outline-secondary sub-filter-btn active" data-filter="All">All</button>
        <button class="btn btn-outline-success sub-filter-btn" data-filter="Active">Active</button>
        <button class="btn btn-outline-warning sub-filter-btn" data-filter="Expiring Soon">Expiring Soon</button>
        <button class="btn btn-outline-danger sub-filter-btn" data-filter="Expired">Expired</button>
      </div>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Subscription Status</th>
            <th>Expiration Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-table-body"></tbody>
      </table>
    </div>
  </div>
</section>

<div class="modal fade" id="renewSubscriptionModal" tabindex="-1" aria-labelledby="renewSubscriptionModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="renewSubscriptionModalLabel">
          <i class="bi bi-arrow-repeat me-2"></i>Renew Subscription
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Renewing subscription for: <strong id="renewUserName"></strong></p>
        <p class="text-muted small">Confirm that payment has been received at the physical library before renewing.</p>
        <form id="renewSubscriptionForm">
          <input type="hidden" id="renewUserId">
          <div class="mb-3">
            <label for="renewExpirationDate" class="form-label">New Expiration Date</label>
            <input type="date" class="form-control" id="renewExpirationDate" name="renewExpirationDate" required>
          </div>
          <div class="modal-footer px-0 pb-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle me-1"></i>Confirm Renewal
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
  $(document).ready(function() {
    function initManageUsers() {
      if (window.location.hash.includes('#manage-users')) {
        if (typeof ManageUsersController !== 'undefined') {
          ManageUsersController.isInitialized = false;
          ManageUsersController.init();
        }
      }
    }

    initManageUsers();

    $(window).on('hashchange', function() {
      setTimeout(initManageUsers, 100);
    });
  });
</script>
