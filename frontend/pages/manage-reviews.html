<section id="manage-reviews" class="manage-reviews section">
  <div class="container" data-aos="fade-up" data-aos-delay="100">
    <h3 class="text-center mb-5">Manage Reviews</h3>

    <div id="reviews-table-wrapper">
      <div class="text-center py-5">
        <div class="spinner-border" role="status"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="confirmDeleteReviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Review</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Are you sure you want to delete this review? This action cannot be undone.</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteReviewBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>
</section>

<script type="text/javascript">
  $(document).ready(function() {
    if (window.location.hash.includes('#manage-reviews')) {
      if (typeof ManageReviewsController !== 'undefined') {
        ManageReviewsController.init();
      }
    }
    $(window).on('hashchange', function() {
      if (window.location.hash.includes('#manage-reviews')) {
        if (typeof ManageReviewsController !== 'undefined') {
          setTimeout(function() {
            ManageReviewsController.init();
          }, 100);
        }
      }
    });
  });
</script>
